apiVersion: apps/v1
kind: Deployment
metadata:
  name: webbuilder
  labels:
    app: webbuilder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webbuilder
  template:
    metadata:
      labels:
        app: webbuilder
    spec:
      containers:
        - name: webbuilder
          image: webbuilder/server:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webbuilder
spec:
  selector:
    app: webbuilder
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webbuilder
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: webbuilder.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webbuilder
                port:
                  number: 80
